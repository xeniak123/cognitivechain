name: Release

# Builds the artifacts end users download: the node binary and the one-file
# miner, for Windows and Linux. Triggered by pushing a tag such as `v1.0.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            node_bin: cog-node
            miner_bin: cog-miner
          - os: windows-latest
            label: windows-x64
            node_bin: cog-node.exe
            miner_bin: cog-miner.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build node
        working-directory: node
        run: cargo build --release

      - name: Verify the node before shipping it
        working-directory: node
        run: |
          cargo test --release
          cargo run --release -- selftest

      - name: Build miner executable
        working-directory: miner
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python build_release.py --clean

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "node/target/release/${{ matrix.node_bin }}" dist/
          cp "miner/dist/${{ matrix.miner_bin }}" dist/
          cp genesis/genesis.mainnet.json dist/genesis.json
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS-${{ matrix.label }}.txt
          else
            certutil -hashfile "${{ matrix.node_bin }}" SHA256 \
              > SHA256SUMS-${{ matrix.label }}.txt
            certutil -hashfile "${{ matrix.miner_bin }}" SHA256 \
              >> SHA256SUMS-${{ matrix.label }}.txt
          fi
          cat SHA256SUMS-${{ matrix.label }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cognitivechain-${{ matrix.label }}
          path: dist/*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          body: |
            ## Jak kopać COG

            1. Pobierz `cog-miner` (Linux) lub `cog-miner.exe` (Windows).
            2. Załóż portfel: `cog-node keygen --out wallet.json` — zapisz adres.
            3. Uruchom: `cog-miner --wallet <TWÓJ_ADRES> --pool <IP_WĘZŁA>`
            4. GPU NVIDIA? Doinstaluj PyTorch z CUDA — koparka wykryje kartę sama.

            Zweryfikuj pobrane pliki sumami z `SHA256SUMS-*.txt`.
