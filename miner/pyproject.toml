[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-miner"
version = "1.0.0"
description = "CognitiveChain (COG) Proof-of-Useful-Work miner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "blake3>=0.4",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]

[project.scripts]
cog-miner = "cog_miner.cli:main"

[tool.setuptools]
packages = ["cog_miner"]
