[package]
name = "cog-node"
version = "1.0.0"
edition = "2021"
description = "CognitiveChain (COG) Layer-1 node: Proof-of-Useful-Work over verifiable tensor computation"
license = "Apache-2.0"

[lib]
name = "cog_node"
path = "src/lib.rs"

[[bin]]
name = "cog-node"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
bincode = "1.3"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
